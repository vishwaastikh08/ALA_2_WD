<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krishna in Peaceful Garden</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to top, #ffd89b, #19547b);
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .sun {
      position: absolute;
      top: 60px;
      right: 100px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #fff176, #f57f17);
      border-radius: 50%;
      z-index: 1;
    }

    .cloud {
      position: absolute;
      top: 50px;
      width: 140px;
      height: 70px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.8;
      animation: floatClouds 60s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud::before {
      width: 100px;
      height: 100px;
      top: -20px;
      left: 20px;
    }

    .cloud::after {
      width: 120px;
      height: 120px;
      top: -30px;
      right: 10px;
    }

    @keyframes floatClouds {
      0% { left: -200px; }
      100% { left: 120vw; }
    }

    .garden {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(to top, #2e7d32, #66bb6a);
      z-index: 2;
    }

    .tree {
      position: absolute;
      bottom: 150px;
      left: 100px;
      width: 350px;
      height: 400px;
      background: url('finaltree.png') no-repeat center/contain;
      background-size: contain;
      z-index: 2;
    }

    .krishna {
      position: absolute;
      bottom: 100px;
      left: 160px;
      width: 180px;
      height: 250px;
      background: url('final krishna image.png') no-repeat center/contain;
      background-size: contain;
      z-index: 3;
    }

    .animal {
      position: absolute;
      bottom: 180px;
      width: 160px;
      height: 120px;
      background-size: contain;
      background-repeat: no-repeat;
      animation: eatGrass 3s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes eatGrass {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px) rotateZ(-2deg); }
    }

    .cow1 { left: 500px; background-image: url('final cow image.png'); }
    .deer1 { left: 700px; background-image: url('final cow image.png'); }
    .goat1 { left: 880px; background-image: url('final cow image.png'); }

    .message {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 1.8rem;
      color: #fffde7;
      text-shadow: 1px 1px 4px #000;
      z-index: 5;
    }

    #playEmoji {
      cursor: pointer;
      padding-left: 10px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud" style="top: 40px; animation-delay: 0s;"></div>
    <div class="cloud" style="top: 100px; animation-delay: 15s;"></div>

    <!-- Tree and Krishna -->
    <div class="tree"></div>
    <div class="krishna"></div>

    <!-- Animals -->
    <div class="animal cow1"></div>
    <div class="animal deer1"></div>
    <div class="animal goat1"></div>

    <!-- Garden -->
    <div class="garden"></div>

    <!-- Message with emoji trigger -->
    <div class="message">
      Krishna plays his flute as the animals graze in peace. Click There:-
      <span id="playEmoji">🎶</span>
    </div>

    <!-- Flute Music (not autoplayed) -->
    <audio id="bgMusic" loop>
      <source src="krishna flute audio.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    const playEmoji = document.getElementById("playEmoji");

    bgMusic.volume = 1.0;

    playEmoji.addEventListener("click", () => {
      if (bgMusic.paused) {
        bgMusic.play();
        playEmoji.textContent = "⏸️"; // Change to pause icon
      } else {
        bgMusic.pause();
        playEmoji.textContent = "🎶"; // Change back to music note
      }
    });
  </script>
</body>
</html>
